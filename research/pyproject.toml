[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-frontier"
version = "0.1.0"
description = "Research package for evaluation frontier analysis"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
]

[dependency-groups]
analysis = [
    "altair>=6.3.0",
    "marimo>=0.25.0",
    "pandas>=3.0.6",
    "watchdog>=6.0.0",
]
dev = [
    "basedpyright>=1.31.0",
    "deptry>=0.23.0",
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "A",
    "C4",
    "DTZ",
    "FA",
    "ISC",
    "PIE",
    "PERF",
    "RET",
    "RSE",
]
ignore = [
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# marimo displays a cell's last expression.
"analysis/notebooks/*.py" = ["B018"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = ["src", "analysis/notebooks"]
typeCheckingMode = "standard"

[[tool.basedpyright.executionEnvironments]]
root = "analysis/notebooks"
# marimo displays a cell's last expression.
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = "src"

[tool.deptry]
extend_exclude = ["data", "analysis"]

[project.scripts]
eval-frontier = "eval_frontier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# `marimo edit --watch` reloads notebooks saved in another editor; autorun
# re-executes the changed cells instead of only marking them stale.
[tool.marimo.runtime]
watcher_on_save = "autorun"
