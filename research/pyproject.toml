[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-frontier"
version = "0.1.0"
description = "Research package for evaluation frontier analysis"
requires-python = ">=3.11"

[project.scripts]
eval-frontier = "eval_frontier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
