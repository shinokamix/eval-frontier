$schema: 'https://moonrepo.dev/schemas/project.json'

language: typescript

tasks:
  install:
    command: corepack pnpm install
    options:
      cache: false

  sync-data:
    command: node scripts/sync-research.mjs
    deps:
      - research:build
    outputs:
      - 'public/data/research.json'

  dev:
    command: corepack pnpm exec vp dev
    deps:
      - sync-data
    options:
      persistent: true
  build:
    command: corepack pnpm exec vp build
    deps:
      - sync-data

  check:
    command: corepack pnpm exec vp check

  knip:
    command: corepack pnpm exec knip --no-progress
