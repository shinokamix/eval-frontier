$schema: 'https://moonrepo.dev/schemas/workspace.json'

projects:
  - 'apps/*'
  - 'research'
  - '.'

# Unscoped targets such as `moon run dev` resolve to the root aliases in moon.yml.
defaultProject: 'root'

vcs:
  client: git
  defaultBranch: main
  sync: true
  hooks:
    pre-commit:
      - 'moon run web:check web:knip research:lint research:format research:notebooks research:types research:deps --affected --status=staged'
